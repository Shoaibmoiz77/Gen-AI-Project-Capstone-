name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  retrieval-quality-gate:
    # Offline eval: no API key needed. Fails the build if retrieval regresses.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: groundwork ingest
      - run: groundwork eval --llm fake --out reports/ci --min-recall 0.9
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/ci/

  live-eval:
    # Full eval with a real model + LLM judge. Runs on main only, when a key secret is set.
    # Uses ANTHROPIC_API_KEY if present, otherwise GROQ_API_KEY / GEMINI_API_KEY.
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.GROQ_API_KEY != '' || secrets.GEMINI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-python@v5
        if: env.HAS_KEY == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: env.HAS_KEY == 'true'
        run: |
          pip install -e .
          groundwork ingest
          groundwork eval --out reports/live
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: live-eval-report
          path: reports/live/
