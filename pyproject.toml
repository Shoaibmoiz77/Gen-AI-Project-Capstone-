[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groundwork-rag"
version = "0.1.0"
description = "Grounded question answering over your documents: hybrid retrieval, cited answers from Claude, and an evaluation harness that measures it all."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shoaib Mohammed Moizuddin" }]
dependencies = [
  "anthropic>=0.40",
  "numpy>=1.26",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.3"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
groundwork = "groundwork.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
groundwork = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
